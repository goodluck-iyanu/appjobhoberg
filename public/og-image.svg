  <!-- Brand Badge -->
  <rect x="390" y="90" width="420" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <circle cx="415" cy="112" r="6" fill="#DC2626"/>
  <text x="432" y="118" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">BUILT BY HOBERG DIGITAL AGENCY</text>

