    <rect x="185" y="0" width="180" height="42" rx="21" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-opacity="0.4"/>
    <text x="275" y="26" text-anchor="middle" fill="#FCA5A5" font-family="sans-serif" font-size="15" font-weight="600">Virtual Assistant</text>

    <rect x="380" y="0" width="150" height="42" rx="21" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-opacity="0.4"/>
    <text x="455" y="26" text-anchor="middle" fill="#FCA5A5" font-family="sans-serif" font-size="15" font-weight="600">Writing &amp; SEO</text>

